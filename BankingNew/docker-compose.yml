services:
  mysqldb:
    image: mysql:5.7
    container_name: banking-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    env_file: ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQLDB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQLDB_DATABASE}
    ports:
      - "3307:3306"   # ✅ expose MySQL to host (Workbench)
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$MYSQLDB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: banking-app
    depends_on:
      mysqldb:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    env_file: ./.env
    ports:
      - ${SPRING_LOCAL_PORT}:${SPRING_DOCKER_PORT}   # ✅ Spring Boot port
    environment:
      SPRING_APPLICATION_JSON: >
        {
          "spring.datasource.url":"jdbc:mysql://mysqldb:${MYSQLDB_DOCKER_PORT}/${MYSQLDB_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true",
          "spring.datasource.username":"${MYSQLDB_USER}",
          "spring.datasource.password":"${MYSQLDB_ROOT_PASSWORD}",
          "spring.jpa.hibernate.ddl-auto":"update"
        }
    volumes:
      - ~/.m2:/root/.m2
    stdin_open: true
    tty: true

volumes:
  db: